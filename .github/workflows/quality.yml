name: PHP quality
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: klaxon_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s --health-timeout=5s --health-retries=8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Load test database
        run: sed 's/USE klaxon;/USE klaxon_test;/' sql/schema.sql | mysql -h 127.0.0.1 -u root -proot
      - name: PHP syntax
        run: find src public views tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PHPUnit
        env:
          TEST_DB_NAME: klaxon_test
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
        run: composer test
      - name: PHPStan
        run: composer analyse
