name: PHP quality
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: klaxon_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s --health-timeout=5s --health-retries=8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Build and verify local Bootstrap assets
        run: |
          npm ci --no-audit --no-fund
          npm run build:css 2>/dev/null
          git diff --exit-code -- public/assets/style.css
          cmp node_modules/bootstrap/dist/js/bootstrap.bundle.min.js public/assets/bootstrap.bundle.min.js
      - name: Load test database
        run: sed 's/USE klaxon;/USE klaxon_test;/' sql/schema.sql | mysql -h 127.0.0.1 -u root -proot
      - name: PHP syntax
        run: find src public views tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PHPUnit
        env:
          TEST_DB_NAME: klaxon_test
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
        run: composer test
      - name: HTTP smoke test
        run: bash tests/smoke.sh
      - name: Import initial sample data
        run: |
          sed 's/USE klaxon;/USE klaxon_test;/' sql/seed.sql | mysql -h 127.0.0.1 -u root -proot
          test "$(mysql -N -h 127.0.0.1 -u root -proot klaxon_test -e 'SELECT COUNT(*) FROM users')" = 23
      - name: Capture real browser pages
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright-core@1.55.1
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export VISUAL_PASS="$(openssl rand -hex 20)"
          visual_hash="$(php -r 'echo password_hash(getenv("VISUAL_PASS"), PASSWORD_DEFAULT);')"
          mysql -h 127.0.0.1 -u root -proot klaxon_test -e "INSERT INTO users(last_name,first_name,phone,email,password_hash,role) VALUES ('Demo','Visuel','0000000000','visual@example.test','$visual_hash','employee'),('Demo','Admin','0000000000','visualadmin@example.test','$visual_hash','admin');"
          DB_NAME=klaxon_test DB_HOST=127.0.0.1 DB_USER=root DB_PASSWORD=root php -S 127.0.0.1:8766 -t public public/router.php > /tmp/klaxon-visual-server.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for i in {1..20}; do if curl -fsS http://127.0.0.1:8766/ -o /dev/null; then break; fi; sleep .5; done
          node tests/visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-visuelles
          path: visual-captures/*.png
          if-no-files-found: ignore
      - name: PHPStan
        run: composer analyse
